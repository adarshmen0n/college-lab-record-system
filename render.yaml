services:
  - type: web
    name: college-lab-record-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python templates/saved_templates/create_reference_template.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
